                "D. Dst. Host digunakan untuk koneksi kabel, Path untuk koneksi nirkabel (Wi-Fi)"
            ],
            answer: 0 // A
        },
        {
            q: "Saat memblokir file video .mp4, selain mengisikan '*.mp4*' pada Path, administrator terkadang juga memfilter berdasarkan Tipe Data dengan mengisi tipe MIME pada kolom?",
            options: [
                "A. Dst. Port",
                "B. Action",
                "C. Src. Address",
                "D. MIME Type"
            ],
            answer: 3 // D
        },
        {
            q: "Apakah dampak negatif utama dari penggunaan Transparent Proxy (NAT Redirect) dibandingkan dengan mengonfigurasi Proxy secara manual (Explicit Proxy) di masing-masing browser klien?",
            options: [
                "A. Internet menjadi tidak stabil",
                "B. Transparent Proxy memaksa router bekerja ekstra berat mengubah header paket (NATting), serta tidak mendukung koneksi HTTPS secara otomatis tanpa sertifikat tambahan",
                "C. Browser klien akan selalu hang",
                "D. Tidak bisa memblokir situs sama sekali"
            ],
            answer: 1 // B
        },
        {
            q: "Tanda centang biru (✓) pada jendela Winbox, baik pada menu Interface maupun Filter Rules, berfungsi untuk?",
            options: [
                "A. Menghapus konfigurasi",
                "B. Menonaktifkan (Disable) aturan",
                "C. Mengaktifkan (Enable) aturan atau antarmuka yang sebelumnya dimatikan",
                "D. Menyimpan cadangan (Backup)"
            ],
            answer: 2 // C
        },
        {
            q: "Untuk mencadangkan seluruh pengaturan MikroTik (termasuk setting Proxy, Firewall, IP) ke dalam bentuk file skrip teks yang bisa dibaca manusia, perintah apa yang diketikkan di Terminal?",
            options: [
                "A. /system backup save",
                "B. /export file=namafile",
                "C. /ip proxy print",
                "D. /tool fetch"
            ],
            answer: 1 // B
        },
        {
            q: "Sebuah perangkat Switch (Manageable) yang biasa dihubungkan ke Router MikroTik beroperasi pada OSI Layer ke?",
            options: [
                "A. Layer 1 (Physical)",
                "B. Layer 2 (Data Link)",
                "C. Layer 3 (Network)",
                "D. Layer 4 (Transport)"
            ],
            answer: 1 // B
        },
        {
            q: "Manakah pernyataan yang BENAR mengenai protokol TCP dan UDP?",
            options: [
                "A. TCP lebih cepat dari UDP, namun UDP lebih handal",
                "B. TCP tidak memerlukan proses koneksi (Connectionless), UDP membutuhkan handshake",
                "C. TCP menjamin paket sampai ke tujuan dengan utuh (Connection-oriented/Reliable), sedangkan UDP mengirim cepat tanpa peduli paket hilang (Connectionless)",
                "D. TCP hanya digunakan untuk ping, UDP digunakan untuk browsing web"
            ],
            answer: 2 // C
        },
        {
            q: "Pada struktur IP Address 192.168.10.1/24, angka /24 menunjukkan Netmask/Subnet Mask sebesar?",
            options: [
                "A. 255.0.0.0",
                "B. 255.255.0.0",
                "C. 255.255.255.0",
                "D. 255.255.255.255"
            ],
            answer: 2 // C
        },
        {
            q: "Mengapa sebuah komputer/laptop (Klien) harus mendapatkan IP Address satu jaringan (segmen) yang sama dengan Router agar bisa saling berkomunikasi langsung (tanpa melalui routing tambahan)?",
            options: [
                "A. Agar router bisa mematikan komputer klien dari jarak jauh",
                "B. Agar protokol ARP (Address Resolution Protocol) di Layer 2 bisa menerjemahkan IP tersebut menjadi MAC Address dan paket data bisa dikirim langsung melalui Switch/Kabel LAN",
                "C. Agar komputer klien tidak terkena virus",
                "D. Agar kecepatan internet menjadi ganda"
            ],
            answer: 1 // B
        }
    ];
    const qContainer = document.getElementById('questionsContainer');
    let isSubmitted = false;

    bankSoal.forEach((soal, index) => {
        let optionsHTML = '';
        soal.options.forEach((opt, optIndex) => {
            optionsHTML += `<li><label style="display:flex; width:100%; cursor:pointer; color:#ccc; font-weight:normal;"><input type="radio" name="q${index}" value="${optIndex}">${opt}</label></li>`;
        });
        qContainer.innerHTML += `<div class="question-box"><div class="question-text">${index + 1}. ${soal.q}</div><ul class="options-list">${optionsHTML}</ul></div>`;
    });

    let timeLeft = DURASI_MENIT * 60;
    const timerDisplay = document.getElementById('timerDisplay');
    const timer = setInterval(() => {
        if(isSubmitted) { clearInterval(timer); return; }
        timeLeft--;
        let m = Math.floor(timeLeft / 60); let s = timeLeft % 60;
        timerDisplay.innerText = `WAKTU TERSISA: ${m < 10 ? '0':''}${m}:${s < 10 ? '0':''}${s}`;
        if (timeLeft <= 60) timerDisplay.classList.add('warning');
        if (timeLeft <= 0) { clearInterval(timer); timerDisplay.innerText = "WAKTU HABIS!"; autoSubmit(); }
    }, 1000);

    function manualSubmit() {
        const n = document.getElementById('inputNama').value.trim(), k = document.getElementById('inputKelas').value.trim();
        if(!n || !k) return alert('Lengkapi Nama dan Kelas!');
        if(confirm("Kirim jawaban sekarang?")) prosesEvaluasi(n, k);
    }
    function autoSubmit() {
        alert("WAKTU HABIS! Mensubmit otomatis.");
        prosesEvaluasi(document.getElementById('inputNama').value.trim() || "Anonim", document.getElementById('inputKelas').value.trim() || "Tidak Diisi");
    }

    async function prosesEvaluasi(nama, kelas) {
        isSubmitted = true;
        document.getElementById('btnSubmit').style.display = 'none';
        document.getElementById('loadingMsg').style.display = 'block';
        document.querySelectorAll('input').forEach(i => i.disabled = true);

        let benar = 0, salah = 0;
        bankSoal.forEach((soal, index) => {
            const sel = document.querySelector(`input[name="q${index}"]:checked`);
            if (sel && parseInt(sel.value) === soal.answer) benar++; else salah++;
        });

        let skorAkhir = Math.round((benar / bankSoal.length) * 100);
        const payload = { "Nama": nama, "Kelas": kelas, "Sesi": NAMA_SESI, "Benar": benar, "Salah": salah, "Skor_Akhir": skorAkhir };

        try {
            const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
            const result = await response.json();
            if(result.result === 'success') {
                document.getElementById('examScreen').style.display = 'none';
                document.getElementById('resultScreen').style.display = 'block';
                document.getElementById('finalScoreDisplay').innerText = skorAkhir;
                document.getElementById('ansCorrect').innerText = benar; document.getElementById('ansWrong').innerText = salah;
                timerDisplay.style.display = 'none';
            } else throw new Error(result.error);
        } catch (error) {
            alert("GAGAL MENGIRIM! Pastikan koneksi internet stabil.");
            document.getElementById('btnSubmit').style.display = 'block';
            document.getElementById('loadingMsg').style.display = 'none';
            document.querySelectorAll('input').forEach(i => i.disabled = false);
            isSubmitted = false;
        }
    }
</script>
