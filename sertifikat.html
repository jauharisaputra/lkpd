<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLAIM SERTIFIKAT | CYBER SECURITY LAB</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        body { font-family: 'Share Tech Mono', monospace; background-color: #03070d; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: rgba(20, 18, 5, 0.9); padding: 30px; border-radius: 8px; border: 1px solid #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.1); }
        h1 { color: #ffd700; text-shadow: 0 0 10px #ffd700; border-bottom: 2px dashed #ffd700; padding-bottom: 15px; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #ccc;}
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ffd700; border-radius: 4px; box-sizing: border-box; background: #000; color: #ffd700; font-family: inherit; text-align: center; font-size: 1.2em; letter-spacing: 2px;}
        input:focus { outline: none; box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);}
        button { background-color: transparent; color: #ffd700; padding: 15px 20px; border: 2px solid #ffd700; border-radius: 4px; cursor: pointer; margin-top: 25px; font-size: 18px; width: 100%; font-weight: bold; font-family: inherit; transition: 0.3s;}
        button:hover { background-color: #ffd700; color: #000; box-shadow: 0 0 15px #ffd700;}
        a.btn-back { display: inline-block; margin-top: 20px; color: #ffd700; text-decoration: none; border: 1px solid #ffd700; padding: 10px 20px; transition: 0.3s; }
        a.btn-back:hover { background: #ffd700; color: #000; }
        .info-box { background: rgba(255, 215, 0, 0.1); padding: 15px; border-left: 4px solid #ffd700; margin-bottom: 20px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>> ACHIEVEMENT / KLAIM SERTIFIKAT_</h1>
        <div class="info-box">
            Sistem akan memverifikasi apakah status Anda sudah menyelesaikan seluruh modul Praktik (Sesi 1-3) dan Evaluasi CBT dengan nilai di atas batas minimum.
        </div>

        <form onsubmit="event.preventDefault(); document.getElementById('btnCetak').innerText = 'VERIFYING DATA...'; setTimeout(() => { alert('Sistem mendeteksi data belum lengkap atau nilai belum final. Silakan cek menu Student Tracker terlebih dahulu.'); document.getElementById('btnCetak').innerText = '> GENERATE CERTIFICATE_'; }, 2000);">
            <label style="text-align:center;">NAMA LENGKAP ATAU NIS:</label>
            <input type="text" required placeholder="NAMA / NIS...">
            
            <button type="submit" id="btnCetak">> GENERATE CERTIFICATE_</button>
        </form>

        <a href="index.html" class="btn-back">< BACK TO MAIN SYSTEM</a>
    </div>
</body>
</html>
