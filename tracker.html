<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT TRACKER | CYBER SECURITY LAB</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #050b14;
            color: #00ffcc;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: rgba(5, 15, 30, 0.95);
            padding: 40px;
            border-radius: 8px;
            border: 1px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }

        h1 {
            margin-top: 0;
            text-shadow: 0 0 10px #00ffcc;
        }

        /* Modifikasi desain agar cocok untuk Dropdown */
        select {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            font-size: 1.2em;
            font-family: inherit;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 4px;
            cursor: pointer;
            appearance: none;
        }

        select:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        button {
            background: #00ffcc;
            color: #000;
            font-family: inherit;
            font-size: 1.2em;
            padding: 10px 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }

        button:hover {
            background: #00ccaa;
        }

        .result-box {
            margin-top: 30px;
            text-align: left;
            background: #02060d;
            padding: 20px;
            border-radius: 4px;
            border: 1px solid #005544;
            display: none;
        }

        .module-item {
            padding: 15px 0;
            border-bottom: 1px dashed #005544;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-done {
            color: #00ffcc;
            font-weight: bold;
        }

        .status-missing {
            color: #ff3333;
            font-weight: bold;
        }

        #loading {
            display: none;
            color: #ffaa00;
            margin-top: 20px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        a.btn-back {
            display: block;
            margin-top: 30px;
            color: #00ffcc;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>> STATUS_CHECKER_</h1>
        <p>Lacak status pengumpulan tugas dan ujian Anda.</p>

        <!-- Input diganti menjadi Dropdown -->
        <select id="searchInput">
            <option value="">-- MENGUMPULKAN DATA DARI SERVER... --</option>
        </select>
        <br>
        <button onclick="checkStatus()">SYSTEM SCAN</button>

        <div id="loading">> SEARCHING DATABASES... PLEASE WAIT_</div>

        <div class="result-box" id="resultBox">
            <h3 style="border-bottom: 1px solid #00ffcc; padding-bottom: 10px;">Hasil Scan untuk: <span
                    id="studentNameDisplay"></span></h3>
            <div id="statusList"></div>
        </div>

        <a href="index.html" class="btn-back">
            < KEMBALI KE MENU UTAMA</a>
    </div>

    <script>
        // DAFTAR DATABASE YANG DILACAK
        const databases = [
            { name: "LKPD Sesi 1 - Firewall (Fisik)", id: "1nDsWB4oj9c6ITF2kONDEINZWyn3E35JYs7Y0tO5EMsY" },
            { name: "LKPD Sesi 2 - Web Proxy (Fisik)", id: "1DU_VLdSTESGEUoscnIklwu_saDYgRA99r_8UhzzfnTE" },
            { name: "LKPD Sesi 3 - Hotspot (Fisik)", id: "1NWvz8KHYSxr2PqEY6n0tzBFHFkYiEVZKGivAQz4Wujs" },
            { name: "Ujian CBT (Sesi 1-3 Gabungan)", id: "1c4GFsP_kqJ5NlRNgq3P0Fto5cpMY8bdvG99KRVbrdyY" }
        ];

        // 1. Script Fetching Data untuk mengisi Dropdown Nama secara Real-time
        window.addEventListener('DOMContentLoaded', async () => {
            const selectElement = document.getElementById('searchInput');
            let allNames = new Set();

            try {
                // Menarik data dari seluruh database secara bersamaan (paralel)
                const fetchPromises = databases.map(db => {
                    return new Promise((resolve) => {
                        const csvUrl = `https://docs.google.com/spreadsheets/d/${db.id}/export?format=csv`;
                        Papa.parse(csvUrl, {
                            download: true,
                            header: true,
                            complete: function (results) {
                                results.data.forEach(row => {
                                    if (row.Nama && row.Nama.trim() !== "") {
                                        // Mengubah jadi lowercase agar aman saat pengecekan duplikat
                                        allNames.add(row.Nama.trim().toLowerCase());
                                    }
                                });
                                resolve();
                            },
                            error: function () { resolve(); } // Tetap resolve jika 1 db gagal agar tidak macet
                        });
                    });
                });

                await Promise.all(fetchPromises);
                let sortedNames = Array.from(allNames).sort();

                if (sortedNames.length > 0) {
                    selectElement.innerHTML = '<option value="">-- KLIK UNTUK MEMILIH NAMA --</option>';
                    sortedNames.forEach(nama => {
                        let option = document.createElement('option');
                        option.value = nama;
                        option.textContent = nama.toUpperCase(); // Memaksa nama jadi KAPITAL di layar
                        selectElement.appendChild(option);
                    });
                } else {
                    selectElement.innerHTML = '<option value="">-- DATABASE MASIH KOSONG --</option>';
                }
            } catch (error) {
                selectElement.innerHTML = '<option value="">-- GAGAL MEMUAT DATA --</option>';
            }
        });

        // 2. Fungsi Scan Status (Diperbarui menyesuaikan format Select/Dropdown)
        async function checkStatus() {
            const dropdown = document.getElementById('searchInput');
            const nameToSearch = dropdown.value; // Value sudah dalam bentuk lowercase
            const displayName = dropdown.options[dropdown.selectedIndex].text; // Mengambil nama versi KAPITAL

            if (!nameToSearch) { alert("Pilih nama Anda terlebih dahulu!"); return; }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultBox').style.display = 'none';
            const statusList = document.getElementById('statusList');
            statusList.innerHTML = '';
            document.getElementById('studentNameDisplay').innerText = displayName;

            for (let db of databases) {
                const csvUrl = `https://docs.google.com/spreadsheets/d/${db.id}/export?format=csv`;
                let isFound = false;

                try {
                    const response = await fetch(csvUrl);
                    const csvText = await response.text();

                    const parsed = Papa.parse(csvText, { header: true }).data;
                    for (let row of parsed) {
                        if (row.Nama && row.Nama.toLowerCase().trim() === nameToSearch) {
                            isFound = true;
                            break;
                        }
                    }
                } catch (error) {
                    console.error("Gagal membaca database:", db.name);
                }

                const statusHtml = isFound
                    ? `<span class="status-done">✅ COMPLETED</span>`
                    : `<span class="status-missing">❌ MISSING / NOT FOUND</span>`;

                statusList.innerHTML += `
                    <div class="module-item">
                        <span>${db.name}</span>
                        ${statusHtml}
                    </div>
                `;
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>

</html>
