                    "D. Ada virus di komputer"
                ],
                answer: 1 // B
            },
            {
                q: "Jika Anda ingin memperbolehkan aplikasi chatting seperti WhatsApp tetap berfungsi meskipun pengguna belum login Hotspot, teknik tingkat lanjut yang bisa diterapkan adalah membuka trafik port server WhatsApp pada fitur?",
                options: [
                    "A. IP Bindings",
                    "B. Walled Garden IP List / Walled Garden",
                    "C. Simple Queue Priority",
                    "D. DHCP Relay"
                ],
                answer: 1 // B
            },
            {
                q: "Apa yang membedakan Queue Tree dari Simple Queue pada MikroTik?",
                options: [
                    "A. Queue Tree lebih mudah disetting dibanding Simple Queue",
                    "B. Queue Tree hanya berfungsi untuk membatasi Upload",
                    "C. Queue Tree membutuhkan penandaan paket (Packet Mark) di Mangle Firewall dan lebih kompleks namun fleksibel untuk hierarki rumit, sedangkan Simple Queue lebih praktis",
                    "D. Queue Tree tidak memiliki batas kecepatan"
                ],
                answer: 2 // C
            },
            {
                q: "Singkatan dari apakah satuan bit rate 'Mbps' pada pengujian jaringan (seperti yang ditunjukkan oleh aplikasi Speedtest)?",
                options: [
                    "A. Mega Bytes Per System",
                    "B. Mega Bits Per Second",
                    "C. Micro Bands Per Session",
                    "D. Multi Byte Process Speed"
                ],
                answer: 1 // B
            },
            {
                q: "Sistem satuan kecepatan pada MikroTik Simple Queue (misalnya '2M') diukur menggunakan hitungan?",
                options: [
                    "A. Byte",
                    "B. Bit",
                    "C. KiloByte",
                    "D. Baud"
                ],
                answer: 1 // B
            },
            {
                q: "Jika batas 'Max Limit' adalah 10M, maka kecepatan maksimal pengunduhan murni yang mungkin tampil pada program Internet Download Manager klien (yang biasanya menggunakan ukuran MByte/s) adalah di kisaran?",
                options: [
                    "A. 10 MB/s",
                    "B. 100 MB/s",
                    "C. 1.25 MB/s (10 Mbps dibagi 8)",
                    "D. 2 MB/s"
                ],
                answer: 2 // C
            },
            {
                q: "Dalam manajemen jaringan publik, membiarkan satu perangkat menguasai seluruh kapasitas bandwidth (misalnya untuk mengunduh film) sehingga menyebabkan ping tinggi pada pengguna lain dikenal sebagai fenomena?",
                options: [
                    "A. Broadcast Storm",
                    "B. Bandwidth Hogging / Starvation",
                    "C. DHCP Spoofing",
                    "D. Proxy Cache Full"
                ],
                answer: 1 // B
            },
            {
                q: "Pengaturan IP Address MikroTik (misal: 192.168.10.1) dapat diakses melalui domain login Hotspot 'sekolah.net'. Proses resolusi nama menjadi IP di lingkup lokal ini ditangani otomatis oleh RouterOS melalui?",
                options: [
                    "A. Public DNS Google",
                    "B. RouterOS Static DNS yang terbuat otomatis saat Hotspot Setup",
                    "C. ARP Table",
                    "D. Fitur Web Proxy Cache"
                ],
                answer: 1 // B
            },
            {
                q: "Setelah Anda membatasi Target Download sebesar 2M, namun hasil speedtest selalu jauh di atas 2M (misal 10 Mbps). Kemungkinan kesalahan konfigurasi terbesar adalah?",
                options: [
                    "A. Kabel LAN rusak",
                    "B. IP Target yang diketik salah/tidak mencakup IP komputer penguji, atau ada rule lain di atasnya yang tidak dilimit (bypass)",
                    "C. Komputer klien terlalu canggih",
                    "D. Fitur Hotspot sedang menyala"
                ],
                answer: 1 // B
            },
            {
                q: "Ketika router MikroTik me-restart karena listrik padam, apakah data sisa limit waktu (Uptime) pada Hotspot User akan otomatis ter-reset kembali ke 0?",
                options: [
                    "A. Tidak, sisa uptime akan tersimpan dan diakumulasikan",
                    "B. Ya, uptime akan kembali dari awal karena tersimpan di RAM yang hilang saat mati listrik",
                    "C. Uptime akan menjadi negatif",
                    "D. User tersebut otomatis dihapus permanen"
                ],
                answer: 0 // A
            },
            {
                q: "Pada Hotspot Setup, jika Anda memilih antarmuka yang salah (misal memilih ether1 padahal ether1 tersambung ke ISP), dan menyelesaikan proses wizard-nya, solusi perbaikan terbaik adalah?",
                options: [
                    "A. Membuang router",
                    "B. Menghapus konfigurasi di menu Hotspot Servers, Profiles, dan men-disable DHCP Server yang baru tercipta, lalu mengulang setup di interface yang benar",
                    "C. Memutus kabel LAN PC Klien",
                    "D. Mematikan fitur Simple Queue"
                ],
                answer: 1 // B
            }
        ];
        const qContainer = document.getElementById('questionsContainer');
        let isSubmitted = false;

        bankSoal.forEach((soal, index) => {
            let optionsHTML = '';
            soal.options.forEach((opt, optIndex) => {
                optionsHTML += `<li><label style="display:flex; width:100%; cursor:pointer; color:#ccc; font-weight:normal;"><input type="radio" name="q${index}" value="${optIndex}">${opt}</label></li>`;
            });
            qContainer.innerHTML += `<div class="question-box"><div class="question-text">${index + 1}. ${soal.q}</div><ul class="options-list">${optionsHTML}</ul></div>`;
        });

        let timeLeft = DURASI_MENIT * 60;
        const timerDisplay = document.getElementById('timerDisplay');
        const timer = setInterval(() => {
            if (isSubmitted) { clearInterval(timer); return; }
            timeLeft--;
            let m = Math.floor(timeLeft / 60); let s = timeLeft % 60;
            timerDisplay.innerText = `WAKTU TERSISA: ${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            if (timeLeft <= 60) timerDisplay.classList.add('warning');
            if (timeLeft <= 0) { clearInterval(timer); timerDisplay.innerText = "WAKTU HABIS!"; autoSubmit(); }
        }, 1000);

        function manualSubmit() {
            const n = document.getElementById('inputNama').value.trim(), k = document.getElementById('inputKelas').value.trim();
            if (!n || !k) return alert('Lengkapi Nama dan Kelas!');
            if (confirm("Kirim jawaban sekarang?")) prosesEvaluasi(n, k);
        }
        function autoSubmit() {
            alert("WAKTU HABIS! Mensubmit otomatis.");
            prosesEvaluasi(document.getElementById('inputNama').value.trim() || "Anonim", document.getElementById('inputKelas').value.trim() || "Tidak Diisi");
        }

        async function prosesEvaluasi(nama, kelas) {
            isSubmitted = true;
            document.getElementById('btnSubmit').style.display = 'none';
            document.getElementById('loadingMsg').style.display = 'block';
            document.querySelectorAll('input').forEach(i => i.disabled = true);

            let benar = 0, salah = 0;
            bankSoal.forEach((soal, index) => {
                const sel = document.querySelector(`input[name="q${index}"]:checked`);
                if (sel && parseInt(sel.value) === soal.answer) benar++; else salah++;
            });

            let skorAkhir = Math.round((benar / bankSoal.length) * 100);
            const payload = { "Nama": nama, "Kelas": kelas, "Sesi": NAMA_SESI, "Benar": benar, "Salah": salah, "Skor_Akhir": skorAkhir };

            try {
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
                const result = await response.json();
                if (result.result === 'success') {
                    document.getElementById('examScreen').style.display = 'none';
                    document.getElementById('resultScreen').style.display = 'block';
                    document.getElementById('finalScoreDisplay').innerText = skorAkhir;
                    document.getElementById('ansCorrect').innerText = benar; document.getElementById('ansWrong').innerText = salah;
                    timerDisplay.style.display = 'none';
                } else throw new Error(result.error);
            } catch (error) {
                alert("GAGAL MENGIRIM! Pastikan koneksi internet stabil.");
                document.getElementById('btnSubmit').style.display = 'block';
                document.getElementById('loadingMsg').style.display = 'none';
                document.querySelectorAll('input').forEach(i => i.disabled = false);
                isSubmitted = false;
            }
        }
    </script>
</body>
