<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTAL REMEDIAL | CYBER SECURITY LAB</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        body { font-family: 'Share Tech Mono', monospace; background-color: #03070d; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: rgba(20, 10, 5, 0.9); padding: 30px; border-radius: 8px; border: 1px solid #ff9900; box-shadow: 0 0 20px rgba(255, 153, 0, 0.1); }
        h1 { color: #ff9900; text-shadow: 0 0 10px #ff9900; border-bottom: 2px dashed #ff9900; padding-bottom: 15px; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #ccc;}
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ff9900; border-radius: 4px; box-sizing: border-box; background: #000; color: #ff9900; font-family: inherit; }
        button { background-color: transparent; color: #ff9900; padding: 12px 20px; border: 1px solid #ff9900; border-radius: 4px; cursor: pointer; margin-top: 20px; font-size: 16px; width: 100%; font-weight: bold; font-family: inherit; transition: 0.3s;}
        button:hover { background-color: #ff9900; color: #000; box-shadow: 0 0 10px #ff9900;}
        a.btn-back { display: inline-block; margin-top: 20px; color: #ff9900; text-decoration: none; border: 1px solid #ff9900; padding: 10px 20px; transition: 0.3s; }
        a.btn-back:hover { background: #ff9900; color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>> RECOVERY / PORTAL REMEDIAL_</h1>
        <p style="text-align: center; margin-bottom: 30px; color:#aaa;">Ajukan permohonan akses ulang untuk Evaluasi/Ujian yang belum memenuhi standar minimum.</p>

        <form onsubmit="event.preventDefault(); alert('Permohonan terkirim ke Instruktur. Menunggu persetujuan (Otorisasi Manual).');">
            <label>Nama Lengkap:</label>
            <input type="text" required placeholder="Masukkan nama Anda...">
            
            <label>Kelas:</label>
            <input type="text" required placeholder="Contoh: 12 TKJ 1">

            <label>Pilih Modul Remedial/Susulan:</label>
            <select required>
                <option value="">-- Pilih Ujian --</option>
                <option value="CBT1">Ujian Teori CBT - Sesi 1</option>
                <option value="CBT2">Ujian Teori CBT - Sesi 2</option>
                <option value="CBT3">Ujian Teori CBT - Sesi 3</option>
                <option value="ESSAI">Ujian Essai Akhir</option>
            </select>

            <button type="submit">> REQUEST OVERRIDE ACCESS_</button>
        </form>

        <a href="index.html" class="btn-back">< BACK TO MAIN SYSTEM</a>
    </div>
</body>
</html>
